<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Panen Parkour — Arcade Adventure di Peternakan</title>
<style>
  html,body{margin:0;height:100%;background:#1b1410;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.55);cursor:pointer}
</style>
</head>
<body>
<canvas id="c" aria-label="Game Panen Parkour"></canvas>
<script>
'use strict';
/* =========================================================
   PANEN PARKOUR — Arcade Adventure di Peternakan
   Arsitektur: CONFIG (zona, pola rintangan) -> ENGINE (fisika,
   kolisi, skor) -> RENDER (parallax, sprite vektor) -> HUD.
   Tambah zona/rintangan baru cukup lewat ZONES & PAT.
   ========================================================= */
const W = 960, H = 540, G = 440;           // G = permukaan tanah
const GRAV = 2400, JUMP_V = -820, DJUMP_V = -700;
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cvs.style.width = W * scale + 'px'; cvs.style.height = H * scale + 'px';
  cvs.width = Math.round(W * scale * dpr); cvs.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

/* ---------- util ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const hsh = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const hex = c => { const n = parseInt(c.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
let store = null; try { store = window.localStorage; } catch (e) {}
const loadBest = () => { try { return +store.getItem('panenParkourBest') || 0; } catch (e) { return 0; } };
const saveBest = v => { try { store.setItem('panenParkourBest', v); } catch (e) {} };

/* ---------- audio (WebAudio synth, tanpa file) ---------- */
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f1, f2, dur, type = 'square', vol = .07, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(dur, vol = .12) {
  if (!AC || muted) return;
  const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = b; g.gain.value = vol;
  s.connect(g).connect(AC.destination); s.start();
}
const SFX = {
  jump: () => tone(420, 760, .14, 'square', .05),
  dbl: () => tone(620, 1300, .2, 'triangle', .07),
  egg: () => tone(1320, 1760, .07, 'sine', .06),
  gold: () => [880, 1100, 1320, 1760].forEach((f, i) => tone(f, 0, .1, 'triangle', .07, i * .06)),
  hurt: () => { tone(240, 70, .35, 'sawtooth', .08); noise(.2, .1); },
  stomp: () => tone(340, 110, .15, 'square', .08),
  trick: m => { tone(600 + m * 70, 0, .08, 'triangle', .05); tone(900 + m * 70, 0, .1, 'triangle', .05, .07); },
  splash: () => noise(.45, .18),
  slide: () => noise(.18, .05),
  zone: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .18, 'square', .045, i * .11)),
  life: () => [660, 880, 1320].forEach((f, i) => tone(f, 0, .12, 'sine', .08, i * .08)),
  moo: () => { tone(150, 95, .7, 'sawtooth', .06); },
  honk: () => tone(560, 380, .12, 'square', .04),
  over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0, .25, 'triangle', .08, i * .2)),
};

/* ---------- CONFIG: zona petualangan ---------- */
const ZONE_LEN = 500; // meter per zona
const ZONES = [
  { name: 'SAWAH PADI', sub: 'Lompati pematang & lumpur!', sky0: '#6ec3ff', sky1: '#e2f6ff', far: '#9fd0b0', hill: '#6fbf5a', hill2: '#4f9e45', grass: '#5cc23c', soil: '#7a4a26', soilD: '#5c3519' },
  { name: 'KANDANG AYAM', sub: 'Injak angsa galak = STOMP!', sky0: '#ffc46b', sky1: '#fff1d2', far: '#cfdc9e', hill: '#9cc65a', hill2: '#7aa83f', grass: '#7cc23c', soil: '#86562b', soilD: '#62391b' },
  { name: 'LUMBUNG & SILO', sub: 'Lompat ke dinding = WALL RUN!', sky0: '#86b2ff', sky1: '#e4eeff', far: '#a9c2c9', hill: '#79b06a', hill2: '#5a8f4d', grass: '#5fae43', soil: '#6e4423', soilD: '#4f2f17' },
  { name: 'PADANG SAPI', sub: 'Banteng mengamuk — lompati!', sky0: '#ff8a5a', sky1: '#ffe0a8', far: '#d9a07c', hill: '#a8a24c', hill2: '#86833a', grass: '#a4b53c', soil: '#7a4520', soilD: '#552e13' },
];
const TUTORIAL = ['hay', 'corn', 'gap', 'fence'];
const SIGNS = {
  hay: 'LOMPAT!  ▲', corn: 'TAHAN ▼ SLIDE', gap: 'AWAS LUMPUR', fence: 'LOMPAT DEKAT = VAULT',
  barn: 'LOMPAT KE DINDING!', plats: 'LOMPAT 2X DI UDARA', goose: 'INJAK ANGSA!', bull: 'BANTENG! LOMPATI',
};

/* ---------- STATE ---------- */
let state = 'menu', t = 0, camX = 0, camY = 0, shake = 0, overT = 0, newBest = false;
let P, solids, hazards, enemies, pickups, parts, popups, decor, genX, spd, pts, eggs, tricks, lives;
let combo, comboT, mult, magnet, zoneIdx, banner, maxCombo, lastPat, lastGround, tutQ, seenSign, hintT;
let best = loadBest();
const input = { jumpBuf: 0, down: false };

function reset() {
  P = { x: 120, y: G - 60, w: 30, h: 60, vx: 0, vy: 0, onGround: true, slide: false, slideT: 0, wall: null, wallT: 0,
        inv: 0, coyote: 0, airJumps: 1, flip: 0, flipping: false, runPh: 0, takeoff: -999, usedDbl: false, dead: false };
  solids = []; hazards = []; enemies = []; pickups = []; parts = []; popups = []; decor = [];
  genX = 0; spd = 330; pts = 0; eggs = 0; tricks = 0; lives = 3; combo = 0; comboT = 0; mult = 1; magnet = 0;
  zoneIdx = -1; banner = null; maxCombo = 0; lastPat = ''; lastGround = null; tutQ = TUTORIAL.slice(); seenSign = {};
  camX = 0; camY = 0; shake = 0; hintT = 7; input.jumpBuf = 0; input.down = false;
  addGround(0, 900); eggLine(430, G - 40, 6); genX = 900;
  generate();
}
const meters = () => Math.max(0, Math.floor(P.x / 40));
const score = () => meters() + Math.floor(pts);

/* ---------- WORLD BUILDERS ---------- */
function addGround(x, w) {
  if (lastGround && Math.abs(lastGround.x + lastGround.w - x) < 1) { lastGround.w += w; return lastGround; }
  const s = { x, y: G, w, h: 400, kind: 'ground' }; solids.push(s); lastGround = s; return s;
}
function addSolid(kind, x, y, w, h) { const s = { x, y, w, h, kind }; solids.push(s); return s; }
function egg(x, y, type = 'egg') { pickups.push({ x, y, type, ph: Math.random() * 6, taken: false }); }
function eggLine(x, y, n, gap = 34) { for (let i = 0; i < n; i++) egg(x + i * gap, y); }
function eggArc(x, w, baseY, ht, n) { for (let i = 0; i < n; i++) { const u = i / (n - 1); egg(x + u * w, baseY - 4 * u * (1 - u) * ht); } }
function sign(x, key) { if (seenSign[key]) return; seenSign[key] = true; decor.push({ x, text: SIGNS[key] }); }

/* ---------- CONFIG: pola rintangan (s = kecepatan, R = jarak ancang-ancang) ---------- */
const PAT = {
  flat(s, R) { const w = rand(260, 440); addGround(genX, w); if (Math.random() < .7) eggLine(genX + 60, G - 40, randi(3, 6)); genX += w; },
  gap(s, R) {
    addGround(genX, R + 60); sign(genX + 40, 'gap'); genX += R + 60;
    const gw = rand(90, Math.min(240, s * .42));
    eggArc(genX - 30, gw + 60, G - 50, 95, 5); genX += gw;
    const w2 = rand(160, 260); addGround(genX, w2); genX += w2;
  },
  hay(s, R) {
    const L = R + 260; addGround(genX, L); sign(genX + 20, 'hay');
    const stack = Math.random() < .35 && s > 360, x = genX + R, h = stack ? 78 : 40;
    addSolid('hay', x, G - h, 56, h); eggArc(x - 60, 176, G - 50, stack ? 120 : 95, 5); genX += L;
  },
  fence(s, R) {
    const L = R + 260; addGround(genX, L); sign(genX + 20, 'fence');
    const x = genX + R; addSolid('fence', x, G - 62, 58, 62); eggArc(x - 50, 158, G - 50, 105, 4); genX += L;
  },
  fence2(s, R) {
    const sp = s * .75, L = R + sp + 330; addGround(genX, L);
    const x = genX + R; addSolid('fence', x, G - 62, 58, 62); addSolid('fence', x + 58 + sp, G - 62, 58, 62); genX += L;
  },
  corn(s, R) {
    const w = rand(80, 200), L = R + w + 240; addGround(genX, L); sign(genX + 20, 'corn');
    const x = genX + R; hazards.push({ x, y: G - 210, w, h: 176, kind: 'corn' });
    eggLine(x + 10, G - 15, Math.max(2, Math.floor(w / 34))); genX += L;
  },
  chicken(s, R) {
    const L = R + 420; addGround(genX, L);
    enemies.push({ type: 'chicken', x: genX + L + 160, y: G - 78, base: G - 78, w: 34, h: 30, vx: -120, ph: Math.random() * 6 });
    genX += L;
  },
  goose(s, R) {
    const L = R + 520; addGround(genX, L); sign(genX + 20, 'goose');
    enemies.push({ type: 'goose', x: genX + L - 120, y: G - 40, w: 38, h: 40, vx: -65, ph: 0, minX: genX + R * .4 });
    eggLine(genX + L - 170, G - 130, 3); genX += L;
  },
  coop(s, R) {
    const L = R + 470; addGround(genX, L); const x = genX + R;
    addSolid('coop', x, G - 84, 150, 84); eggLine(x + 25, G - 118, 4); genX += L;
  },
  plats(s, R) {
    addGround(genX, R + 40); sign(genX + 20, 'plats'); genX += R + 40;
    let x = genX + rand(60, 100); const n = randi(2, 3);
    for (let i = 0; i < n; i++) {
      const p = addSolid('plat', x, G - rand(55, 120), rand(110, 150), 16);
      eggLine(p.x + 22, p.y - 30, 3); x += p.w + rand(90, Math.min(200, s * .38));
    }
    genX = x; addGround(genX, 240); genX += 240;
  },
  barn(s, R) {
    addGround(genX, R + 40); sign(genX + 10, 'barn');
    const x = genX + R + 40, h = randi(165, 215), w = randi(280, 420);
    addSolid('wall', x, G - h, w, h + 400); eggLine(x + 40, G - h - 34, Math.floor((w - 60) / 40), 40);
    genX = x + w; lastGround = null; const L = rand(220, 320); addGround(genX, L); genX += L;
  },
  silo(s, R) {
    addGround(genX, R + 40); const x = genX + R + 40, h = randi(200, 232);
    addSolid('silo', x, G - h, 110, h + 400); egg(x + 55, G - h - 40, Math.random() < .5 ? 'gold' : 'egg');
    genX = x + 110; lastGround = null; addGround(genX, 280); genX += 280;
  },
  crates(s, R) {
    const sp = s * .55, L = R + 88 + sp + 360; addGround(genX, L); const x = genX + R;
    addSolid('crate', x, G - 44, 44, 44); addSolid('crate', x + 44 + sp, G - 44, 44, 44); addSolid('crate', x + 44 + sp, G - 88, 44, 44);
    eggArc(x + 44 + sp - 40, 130, G - 100, 80, 4); genX += L;
  },
  bull(s, R) {
    const L = R + 900; addGround(genX, L); sign(genX + 20, 'bull');
    enemies.push({ type: 'bull', x: genX + L - 80, y: G - 58, w: 92, h: 58, vx: -250, ph: 0, minX: genX });
    genX += L;
  },
};
function zoneAt(x) { return Math.floor(x / 40 / ZONE_LEN); }
function generate() {
  let guard = 0;
  while (genX < camX + W * 2.2 && guard++ < 50) {
    const z = zoneAt(genX), zi = z % 4, s = Math.min(680, 330 + (genX / 40) * .13), R = s * .55;
    let k;
    if (tutQ.length) k = tutQ.shift();
    else {
      const opts = [['flat', 1], ['gap', 3], ['hay', 3], ['fence', 2], ['corn', 2], ['chicken', 1]];
      if (zi >= 1 || z >= 4) opts.push(['goose', zi === 1 ? 4 : 2], ['coop', 3], ['plats', 2], ['chicken', 2]);
      if (zi >= 2 || z >= 4) opts.push(['barn', zi === 2 ? 4 : 2], ['silo', 2], ['crates', 2]);
      if (zi >= 3 || z >= 4) opts.push(['bull', zi === 3 ? 4 : 2], ['fence2', 2]);
      do {
        let r = Math.random() * opts.reduce((a, o) => a + o[1], 0);
        for (const o of opts) { r -= o[1]; if (r <= 0) { k = o[0]; break; } }
        k = k || 'flat';
      } while (k === lastPat && Math.random() < .7);
    }
    lastPat = k; PAT[k](s, R);
    // bonus langka
    const r = Math.random();
    if (r < .05) egg(genX - 120, G - 95, 'corn');
    else if (r < .08 && lives < 5) egg(genX - 120, G - 95, 'milk');
    else if (r < .13) egg(genX - 120, G - 110, 'gold');
  }
}

/* ---------- FX ---------- */
function burst(x, y, n, cols, sp = 260, g = 900, life = .8, size = 5) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(sp * .3, sp);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .3, g, life: rand(life * .5, life), max: life, col: cols[i % cols.length], size: rand(size * .5, size) });
  }
}
function dust(x, y) { burst(x, y, 6, ['#c9a77a', '#e0c9a3', '#a98a62'], 120, 300, .45, 6); }
function popup(text, x, y, col = '#ffe14d', size = 20) { popups.push({ text, x, y, t: 1.2, col, size }); }

function trick(name, base) {
  combo++; comboT = 4.5; mult = Math.min(8, 1 + Math.floor(combo / 3)); maxCombo = Math.max(maxCombo, combo);
  const gain = base * mult; pts += gain; tricks++;
  const off = popups.filter(p => p.t > .8).length * 22;
  popup(name + '  +' + gain, P.x + 10, P.y - 18 - off, mult >= 4 ? '#ff7bd5' : '#ffe14d', 20);
  SFX.trick(mult);
}
function hurt() {
  if (P.inv > 0 || state !== 'play') return;
  lives--; P.inv = 1.7; combo = 0; comboT = 0; mult = 1; shake = 14; SFX.hurt();
  popup('AUW!', P.x, P.y - 20, '#ff6b5a', 24);
  burst(P.x + 15, P.y + 30, 10, ['#ff7a1a', '#ffffff'], 220, 800, .6, 5);
  if (lives <= 0) gameOver();
}
function standUp() { if (P.slide) { P.slide = false; P.y -= 32; P.h = 60; } }
function canStand() {
  const b = { x: P.x, y: P.y - 32, w: P.w, h: 60 };
  for (const h of hazards) if (overlap(b, h)) return false;
  for (const s of solids) if (!s.broken && s.kind !== 'plat' && overlap(b, s)) return false;
  return true;
}
function fallen() {
  SFX.splash(); burst(P.x + 15, G + 30, 22, ['#5b3a1e', '#7a5230', '#3f2a15'], 320, 900, .9, 7);
  lives--; combo = 0; mult = 1; shake = 10;
  if (lives <= 0) { gameOver(); return; }
  let b = null;
  for (const s of solids) if ((s.kind === 'ground' || s.kind === 'wall' || s.kind === 'silo') && s.x + s.w > P.x + 60 && (!b || s.x < b.x)) b = s;
  if (!b) b = addGround(P.x, 600);
  P.x = Math.max(b.x + 24, P.x); P.y = b.y - 60; P.h = 60; P.slide = false; P.vy = 0; P.wall = null; P.inv = 2.2; P.onGround = true;
  enemies = enemies.filter(e => e.x > P.x + 500 || e.x < P.x - 50);
  popup('BYUR! -1', P.x, P.y - 30, '#ff6b5a', 24);
}
function gameOver() {
  state = 'over'; overT = 0; P.dead = true; P.vy = -520; P.wall = null; standUp();
  const sc = score(); newBest = sc > best; if (newBest) { best = sc; saveBest(best); }
  SFX.over();
}

/* ---------- ENGINE: player ---------- */
function land(s) {
  P.airJumps = 1; P.flipping = false; P.flip = 0; P.usedDbl = false;
  dust(P.x + 15, P.y + P.h);
  if (s.kind === 'coop' && !s.hopped) { s.hopped = true; trick('ROOF HOP', 120); }
}
function updatePlayer(dt) {
  const prevTop = P.y;
  // lompat / double jump (flip)
  if (input.jumpBuf > 0 && !P.wall) {
    if (P.onGround || P.coyote > 0) {
      if (!P.slide || canStand()) {
        standUp(); P.vy = JUMP_V; P.onGround = false; P.coyote = 0; P.takeoff = P.x + P.w; P.usedDbl = false;
        input.jumpBuf = 0; SFX.jump(); dust(P.x + 15, P.y + P.h);
      }
    } else if (P.airJumps > 0) {
      standUp(); P.airJumps--; P.vy = DJUMP_V; P.flipping = true; P.flip = 0; P.usedDbl = true; input.jumpBuf = 0;
      SFX.dbl(); burst(P.x + 15, P.y + P.h, 8, ['#fff6b0', '#ffffff'], 160, 200, .5, 4);
    }
  }
  // slide / tukik cepat
  if (input.down && P.onGround && !P.slide && !P.wall) { P.slide = true; P.slideT = 0; P.y += 32; P.h = 28; SFX.slide(); dust(P.x + 20, G); }
  if (input.down && !P.onGround && !P.wall && P.vy < 900) P.vy += 3200 * dt;
  if (P.slide) {
    P.slideT += dt;
    if (((!input.down && P.slideT > .3) || (!P.onGround && P.slideT > .1)) && canStand()) standUp();
    if (P.onGround && Math.random() < .3) parts.push({ x: P.x + 4, y: P.y + P.h, vx: -60, vy: -60, g: 300, life: .3, max: .3, col: '#d8bf95', size: 4 });
  }
  // WALL RUN
  if (P.wall) {
    P.vy = -640; P.y += P.vy * dt; P.wallT += dt; P.runPh += dt * 20;
    if (P.y + P.h <= P.wall.y + 2) {
      P.y = P.wall.y - P.h; P.x += 6; P.vy = -280; P.wall = null; P.airJumps = 1; trick('WALL RUN', 200);
    } else if (P.wallT > .8) { P.wall = null; P.vy = 0; }
    return;
  }
  // gerak horizontal
  P.vx = spd; P.x += P.vx * dt;
  for (const s of solids) {
    if (s.broken || s.kind === 'plat' || !overlap(P, s)) continue;
    const pen = P.y + P.h - s.y;
    if (pen <= 12 && P.vy >= 0) { P.y = s.y - P.h; P.vy = 0; P.onGround = true; continue; }
    if (s.kind === 'ground') { P.x = s.x - P.w - .01; continue; }
    if (s.kind === 'wall' || s.kind === 'silo') {
      P.x = s.x - P.w - .01; const fromGround = P.onGround;
      standUp(); P.wall = s; P.wallT = 0; P.flipping = false; P.flip = 0;
      if (fromGround) hurt();
      return;
    }
    // rintangan pecah (jerami, pagar, peti, kandang)
    s.broken = true; hurt();
    const cols = s.kind === 'hay' ? ['#e8c25a', '#c99a2e', '#f5dc8a'] : ['#a8713a', '#7a4f2a', '#c48b4f'];
    burst(s.x + s.w / 2, s.y + s.h / 2, 24, cols, 340, 1000, .9, 7);
  }
  // gerak vertikal
  P.vy = Math.min(P.vy + GRAV * dt, 1250);
  const pb = P.y + P.h; P.y += P.vy * dt;
  const wasOn = P.onGround; P.onGround = false;
  for (const s of solids) {
    if (s.broken || !overlap(P, s)) continue;
    if (P.vy >= 0 && pb <= s.y + 6) { P.y = s.y - P.h; P.vy = 0; P.onGround = true; if (!wasOn) land(s); }
    else if (s.kind !== 'plat' && P.vy < 0 && prevTop >= s.y + s.h - 6) { P.y = s.y + s.h; P.vy = 0; }
  }
  if (wasOn && !P.onGround && P.vy >= 0) P.coyote = .09; else P.coyote = Math.max(0, P.coyote - dt);
}

/* ---------- ENGINE: frame update ---------- */
function update(dt) {
  input.jumpBuf = Math.max(0, input.jumpBuf - dt);
  spd = Math.min(680, 330 + meters() * .13);
  for (let i = 0; i < 2 && state === 'play'; i++) updatePlayer(dt / 2);
  if (state !== 'play') return;
  P.inv = Math.max(0, P.inv - dt); magnet = Math.max(0, magnet - dt); hintT -= dt;
  comboT -= dt; if (comboT <= 0 && combo > 0) { combo = 0; mult = 1; }
  if (P.onGround) P.runPh += dt * spd / 21;

  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  for (const p of popups) { ctx.globalAlpha = clamp(p.t * 2, 0, 1); txt(p.text, p.x, p.y, p.size, p.col, 'center', '#2a1a0e', 5); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (pl.night) { ctx.fillStyle = 'rgba(15,20,70,.22)'; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  if (state === 'pause') { ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H); txt('JEDA', W / 2, H / 2 - 20, 60, '#fff', 'center', '#2a1a0e', 8); txt('Tekan P / tap untuk lanjut', W / 2, H / 2 + 30, 20, '#ffd27a', 'center', null); }
  if (state === 'over') drawOver();
}

/* ---------- loop ---------- */
function startGame() { reset(); state = 'play'; }
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now; t += dt;
  if (state === 'play') update(dt);
  else if (state === 'menu') { camX += 200 * dt; P.runPh += dt * 16; }
  else if (state === 'over') {
    overT += dt; stepFX(dt);
    if (P.y < camY + H + 200) { P.vy += GRAV * dt; P.y += P.vy * dt; P.x += 120 * dt; P.flip += dt * 6; }
  }
  draw(); requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const JUMP = ['Space', 'ArrowUp', 'KeyW'], DOWN = ['ArrowDown', 'KeyS'];
let isTouch = false;
addEventListener('keydown', e => {
  if (JUMP.includes(e.code) || DOWN.includes(e.code)) e.preventDefault();
  audio(); if (e.repeat) return;
  if (state === 'menu') { if (JUMP.includes(e.code) || e.code === 'Enter') startGame(); return; }
  if (state === 'over') { if ((JUMP.includes(e.code) || e.code === 'Enter') && overT > .8) startGame(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { state = state === 'pause' ? 'play' : 'pause'; return; }
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (state !== 'play') return;
  if (JUMP.includes(e.code)) input.jumpBuf = .14;
  if (DOWN.includes(e.code)) input.down = true;
});
addEventListener('keyup', e => { if (DOWN.includes(e.code)) input.down = false; });
const ptrs = new Map();
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); if (e.pointerType !== 'mouse') isTouch = true;
  const r = cvs.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (state === 'play' || state === 'pause') {
    if (inBtn(x, y, pauseBtn)) { state = state === 'pause' ? 'play' : 'pause'; return; }
    if (inBtn(x, y, muteBtn)) { muted = !muted; return; }
  }
  if (state === 'menu') { startGame(); return; }
  if (state === 'over') { if (overT > .8) startGame(); return; }
  if (state === 'pause') { state = 'play'; return; }
  if (x < W * .4) { input.down = true; ptrs.set(e.pointerId, 'down'); }
  else { input.jumpBuf = .14; ptrs.set(e.pointerId, 'jump'); }
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
});
function ptrUp(e) {
  if (ptrs.get(e.pointerId) === 'down') { ptrs.delete(e.pointerId); input.down = [...ptrs.values()].includes('down'); }
  else ptrs.delete(e.pointerId);
}
cvs.addEventListener('pointerup', ptrUp); cvs.addEventListener('pointercancel', ptrUp);
cvs.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

reset();
requestAnimationFrame(frame);
</script>
</body>
